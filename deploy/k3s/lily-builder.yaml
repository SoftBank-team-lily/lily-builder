# lily-builder 를 k3s 에 올리는 매니페스트.
# - 빌드 Job(Kaniko)은 lily-builds namespace 에 뜬다. 빌더는 그 namespace 의 Job/Secret/ConfigMap/로그만 다룬다
# - "배포된 앱" 화면을 위해 전체 namespace 의 Deployment/Service/Ingress 를 읽기만 한다
# - 배포 이력은 DynamoDB(lily-builds 테이블). AWS 권한 때문에 lily-server 에서만 돈다 (프로비저너와 같은 이유)
# - ECR 에 push 하려면 Kaniko 가 뜨는 노드의 IAM 역할에 ECR push 권한이 있어야 한다
apiVersion: v1
kind: Namespace
metadata:
  name: lily-builds
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lily-builder
  namespace: lily-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lily-builder
  namespace: lily-builds
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lily-builder
  namespace: lily-builds
subjects:
  - kind: ServiceAccount
    name: lily-builder
    namespace: lily-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lily-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lily-builder-read-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lily-builder-read-apps
subjects:
  - kind: ServiceAccount
    name: lily-builder
    namespace: lily-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lily-builder-read-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lily-builder
  namespace: lily-system
  labels:
    app: lily-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lily-builder
  template:
    metadata:
      labels:
        app: lily-builder
    spec:
      serviceAccountName: lily-builder
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: lily-builder
          image: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/lily-builder:latest
          ports:
            - name: http
              containerPort: 8070
          env:
            - name: BUILDER_REGISTRY
              value: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com
            - name: CICD_URL
              value: http://lily-cicd.lily-system.svc
            - name: AWS_REGION
              value: ap-northeast-2
            - name: BUILDS_TABLE
              value: lily-builds
            # 클라우드 버스팅 API 토큰 (lily-builder-burst.yaml 참고). Secret 이 없으면 버스팅 API 는 꺼진다
            - name: BURST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lily-burst
                  key: BURST_API_TOKEN
                  optional: true
            # 온프레미스 에이전트 토큰 서명 키 (/api/agents). Secret 이 없으면 에이전트 기능은 꺼진다
            #   kubectl -n lily-system create secret generic lily-agents --from-literal=AGENT_TOKEN_SECRET=$(openssl rand -hex 32)
            - name: AGENT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: lily-agents
                  key: AGENT_TOKEN_SECRET
                  optional: true
            # 온프레미스 앱 DB (버스팅 DB 공유). lily-db-provisioner 의 토큰을 같이 쓴다
            - name: PROVISIONER_URL
              value: http://db-provisioner.lily-system.svc
            - name: PROVISIONER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: db-provisioner-env
                  key: PROVISIONER_API_TOKEN
                  optional: true
          # 플랫폼 연결 (사용자 PC 에이전트에 Cloudflare 토큰·DB 터널 키를 주지 않는다). Secret 이 없으면 quick tunnel, DB 없는 앱만
          #   PLATFORM_CLOUDFLARE_API_TOKEN / _ACCOUNT_ID / _ZONE_ID / _ZONE_NAME
          #   PLATFORM_TUNNEL_SSH_HOST / PLATFORM_TUNNEL_REMOTE_HOST / PLATFORM_TUNNEL_CA_KEY
          envFrom:
            - secretRef:
                name: lily-agent-platform
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lily-builder
  namespace: lily-system
spec:
  selector:
    app: lily-builder
  ports:
    - name: http
      port: 80
      targetPort: http
