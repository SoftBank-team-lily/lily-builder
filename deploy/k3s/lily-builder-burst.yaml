# 클라우드 버스팅: 온프레미스 에이전트가 lily-builder 의 /api/burst 를 부를 수 있게 한다.
#
# - /api/burst 경로만 Ingress 로 연다. 빌드 폼·이력(/, /api/builds)은 계속 클러스터 내부 전용
# - 토큰: Secret lily-burst 의 BURST_API_TOKEN (lily-builder 와 에이전트가 같은 값을 쓴다)
#     kubectl -n lily-system create secret generic lily-burst --from-literal=BURST_API_TOKEN=$(openssl rand -hex 24)
#     kubectl -n lily-system set env deploy/lily-builder --from=secret/lily-burst
# - lily-system 은 NetworkPolicy 로 외부 유입을 막아 두었으므로 ingress-nginx → lily-builder 만 추가로 연다
# - host
#     builder.apps.lilycloud.kr: ALB(ACM 와일드카드)가 TLS 를 끝내고 ingress-nginx 로 넘긴다. 에이전트는 이 주소를 쓴다
#       (BURST_BUILDER_URL=https://builder.apps.lilycloud.kr, CONTROL_PLANE_URL=wss://builder.apps.lilycloud.kr/api/agents/connect)
#     builder.<공개 IP>.nip.io: TLS 없이 노드로 바로 붙는 예전 주소. 토큰이 평문으로 오가므로 쓰지 않는다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lily-builder-burst
  namespace: lily-system
spec:
  ingressClassName: nginx
  rules:
    - host: builder.43.200.152.53.nip.io
      http:
        paths:
          - path: /api/burst
            pathType: Prefix
            backend:
              service:
                name: lily-builder
                port:
                  number: 80
    - host: builder.apps.lilycloud.kr
      http:
        paths:
          - path: /api/burst
            pathType: Prefix
            backend:
              service:
                name: lily-builder
                port:
                  number: 80
          - path: /api/agents/connect
            pathType: Exact
            backend:
              service:
                name: lily-builder
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-builder
  namespace: lily-system
spec:
  podSelector:
    matchLabels:
      app: lily-builder
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8070
