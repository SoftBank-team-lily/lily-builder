plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lily'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports { mavenBom 'software.amazon.awssdk:bom:2.29.0' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 온프레미스 에이전트가 붙는 소켓 (AgentSocket)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'io.fabric8:kubernetes-client:6.13.5'
    // k3s kubeconfig(/etc/rancher/k3s/k3s.yaml) 의 EC 클라이언트 키를 읽는 데 필요 (없으면 기동 실패)
    runtimeOnly 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    // 배포 이력 저장 (플랫폼 DB)
    implementation 'software.amazon.awssdk:dynamodb'
    // 앱별 ECR 저장소 생성 (없으면 push 가 NAME_UNKNOWN 으로 실패)
    implementation 'software.amazon.awssdk:ecr'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.fabric8:kubernetes-server-mock:6.13.5'
}

tasks.named('test') { useJUnitPlatform() }

tasks.named('bootJar') { archiveFileName = 'app.jar' }
