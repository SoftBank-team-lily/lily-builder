spring:
  application:
    name: lily-builder

server:
  # lily-blog-sample(8080), lily-cicd(8090) 와 겹치지 않게
  port: 8070

lily:
  builder:
    # Kaniko Job 을 띄울 namespace
    namespace: ${BUILDER_NAMESPACE:lily-builds}
    # 이미지를 올릴 레지스트리. ECR 이면 Kaniko 가 실행 노드의 IAM 역할로 인증한다
    registry: ${BUILDER_REGISTRY:}
    # http 레지스트리(로컬 테스트용)면 true
    insecure: ${BUILDER_INSECURE:false}
    # 빌드가 끝나면 배포를 요청할 lily-cicd 주소
    cicd-url: ${CICD_URL:http://localhost:8090}
    # 온프레미스 에이전트가 부르는 /api/burst/** 의 토큰. 비우면 버스팅 API 를 끈다
    burst-token: ${BURST_API_TOKEN:}
    # 온프레미스 앱 DB 를 받을 때 (클라우드 버스팅). lily-db-provisioner 의 주소와 토큰
    provisioner:
      url: ${PROVISIONER_URL:}
      api-token: ${PROVISIONER_API_TOKEN:}
    build-timeout-seconds: ${BUILD_TIMEOUT_SECONDS:900}
    # 온프레미스 에이전트 (/api/agents). 토큰 서명 키가 32자 미만이면 끈다
    agents:
      token-secret: ${AGENT_TOKEN_SECRET:}
      ping-seconds: ${AGENT_PING_SECONDS:25}
    # PC 장애 시 자동 전환: 에이전트가 끊긴 채 이만큼 지나면 공개 주소를 클라우드로 돌린다. 0 이면 끈다
    failover:
      grace-seconds: ${FAILOVER_GRACE_SECONDS:60}
      replicas: ${FAILOVER_REPLICAS:2}
    # 플랫폼 연결: 사용자 PC 에이전트에는 토큰만 두고, 공개 주소(Cloudflare)와 DB 터널 자격은 builder 가 쥔다
    platform:
      cloudflare:
        api-token: ${PLATFORM_CLOUDFLARE_API_TOKEN:}
        account-id: ${PLATFORM_CLOUDFLARE_ACCOUNT_ID:}
        zone-id: ${PLATFORM_CLOUDFLARE_ZONE_ID:}
        zone-name: ${PLATFORM_CLOUDFLARE_ZONE_NAME:}
      tunnel:
        ssh-host: ${PLATFORM_TUNNEL_SSH_HOST:}
        ssh-user: ${PLATFORM_TUNNEL_SSH_USER:lily-tunnel}
        remote-host: ${PLATFORM_TUNNEL_REMOTE_HOST:}
        remote-port: ${PLATFORM_TUNNEL_REMOTE_PORT:5432}
        # 배스천 lily-tunnel 의 authorized_keys 에 cert-authority 로 등록한 CA 의 개인키 (PEM 본문)
        ca-key: ${PLATFORM_TUNNEL_CA_KEY:}
        validity-hours: ${PLATFORM_TUNNEL_VALIDITY_HOURS:24}
        # 온프레미스 DB(내 PC·사용자 DB)를 클라우드 대기 배포에 여는 역방향 터널. 배스천 사설 IP. 비우면 끈다
        reverse-host: ${PLATFORM_TUNNEL_REVERSE_HOST:}
        reverse-port-from: ${PLATFORM_TUNNEL_REVERSE_PORT_FROM:20000}
        reverse-port-to: ${PLATFORM_TUNNEL_REVERSE_PORT_TO:20999}
      # 클라우드 버스팅·거점 전환 (플랫폼 연결 에이전트). 비우면 에이전트에 주지 않는다
      burst:
        # 에이전트 프록시가 넘긴 요청을 받는 클러스터 Ingress (http)
        ingress-host: ${PLATFORM_BURST_INGRESS_HOST:}
        ingress-port: ${PLATFORM_BURST_INGRESS_PORT:80}
        # 거점이 클라우드일 때 앱 CNAME 이 가리키는 호스트 (클러스터 앞 ALB). 비우면 거점 전환을 하지 않는다
        cloud-origin: ${PLATFORM_CUTOVER_ORIGIN:}
    # 배포 이력 테이블 (파티션 키 pk: String). 운영 테이블은 lily-db-provisioner/infra 가 만든다
    dynamodb:
      table: ${BUILDS_TABLE:lily-builds}
      endpoint: ${DYNAMODB_ENDPOINT:}          # 비우면 AWS. DynamoDB Local 이면 http://localhost:8000
      region: ${AWS_REGION:ap-northeast-2}
      create-table: ${DYNAMODB_CREATE_TABLE:false}   # 로컬 전용
  # 로그 사고의 diff 초안. false 면 /api/remediate/drafts 는 모델을 부르지 않는다.
  # GROQ_API_KEY 가 있으면 Groq 의 GROQ_MODEL(기본 openai/gpt-oss-20b)로 diff 를 만든다.
  # 그 키가 없으면 ANTHROPIC_API_KEY, 그다음 OPENAI_API_KEY. PR 은 이 스위치와 별개로 꺼져 있다.
  remediate:
    enabled: ${REMEDIATE_ENABLED:false}
    jev-api-key: ${JEV_API_KEY:}
    # 온프레미스 에이전트가 올린 사건을 frontend 로 넘긴다. 비어 있으면 버린다
    frontend-url: ${REMEDIATE_FRONTEND_URL:}
    token: ${REMEDIATE_TOKEN:}

  # 관측 근거 분석용 내부 API. 토큰이 비어 있으면 /api/diagnoses 는 503.
  diagnosis:
    api-token: ${DIAGNOSIS_API_TOKEN:}
    jev-api-key: ${JEV_API_KEY:}
